<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RecipeShare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container py-2">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="index.html"
        >
          <span class="brand-mark"><i class="bi bi-egg-fried"></i></span>
          RecipeShare
        </a>
        <button
          class="navbar-toggler border-0"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
        >
          <i class="bi bi-list fs-2"></i>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item">
              <a class="nav-link" href="recipes.html">Explore</a>
            </li>
            <li class="nav-item">
              <a class="nav-link protected-link" href="dashboard.html"
                >Dashboard</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link protected-link" href="my-recipes.html"
                >My Recipes</a
              >
            </li>
            <li class="nav-item ms-lg-2">
              <a
                class="btn btn-primary px-4 protected-link"
                href="create-recipe.html"
                ><i class="bi bi-plus-lg me-1"></i>Share Recipe</a
              >
            </li>
            <li class="nav-item ms-lg-2">
              <a
                id="loginBtn"
                class="btn btn-soft auth-nav-btn"
                href="login.html"
                >Login</a
              >
            </li>
            <li class="nav-item ms-lg-2">
              <a
                id="signupBtn"
                class="btn btn-primary auth-nav-btn"
                href="signup.html"
                >Sign Up</a
              >
            </li>
            <li class="nav-item ms-lg-2">
              <button id="logoutBtn" class="btn btn-soft d-none">
                <i class="bi bi-box-arrow-right me-1"></i>Logout
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main>
      <div class="container">
        <div
          class="page-head d-flex flex-wrap justify-content-between align-items-end gap-3"
        >
          <div>
            <span class="category-pill">Your collection</span>
            <h1 class="page-title mt-2">My Recipes</h1>
            <p class="text-muted mb-0">
              Edit or delete recipes you've created.
            </p>
          </div>
          <a href="create-recipe.html" class="btn btn-primary"
            ><i class="bi bi-plus-lg me-1"></i>New Recipe</a
          >
        </div>
        <div id="myRecipesContainer" class="row g-4"></div>
      </div>
    </main>
    <footer>
      <div class="container">
        <div class="row g-4">
          <div class="col-md-7">
            <h4 class="fw-bold">RecipeShare</h4>
            <p class="mb-0 text-white-50">
              Discover, cook and share recipes with your community.
            </p>
          </div>
          <div class="col-md-5 text-md-end">
            <a href="recipes.html" class="me-3">Explore</a
            ><a href="login.html">Login</a>
          </div>
        </div>
        <hr class="border-secondary my-4" />
        <small class="text-white-50">© 2026 RecipeShare</small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
